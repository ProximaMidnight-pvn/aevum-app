<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Токены</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=7" />
  </head>
  <body>
    <main class="app pay-page">
      <a class="legal-back" href="./pay.html">Назад</a>
      <h2 class="pay-title">Токены</h2>
      <div class="pay-stage">
        <p class="partner-note">
          Только на 1 месяц. Покупку можно повторять: срок прибавится к текущей подписке.
        </p>
        <nav class="pay-methods" aria-label="Оплата токенами">
          <button class="pay-btn" type="button" data-token="tokenbasic">
            Базовый · 2 <svg class="pay-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17.6" r="12.6" fill="#C8880A"/><circle cx="16" cy="14.8" r="12.6" fill="#FFE14A"/><circle cx="16" cy="14.8" r="8.2" fill="none" stroke="#E8A317" stroke-width="1.8"/><path fill="#FFF6C2" d="M10 12.4a8.2 8.2 0 0 1 6.4-4.2 7 7 0 0 0-5.6 3.2 6 6 0 0 0-.8 1z"/></svg>
          </button>
          <button class="pay-btn" type="button" data-token="tokenpro">
            PRO · 4 <svg class="pay-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17.6" r="12.6" fill="#C8880A"/><circle cx="16" cy="14.8" r="12.6" fill="#FFE14A"/><circle cx="16" cy="14.8" r="8.2" fill="none" stroke="#E8A317" stroke-width="1.8"/><path fill="#FFF6C2" d="M10 12.4a8.2 8.2 0 0 1 6.4-4.2 7 7 0 0 0-5.6 3.2 6 6 0 0 0-.8 1z"/></svg>
          </button>
        </nav>
        <p class="pay-status" id="pay-status" hidden></p>
      </div>
    </main>
    <script src="./app.js?v=7"></script>
  </body>
</html>
