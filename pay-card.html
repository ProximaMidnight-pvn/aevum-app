<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Aevum — Банковская карта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=15" />
  </head>
  <body>
    <main class="app pay-page">
      <a class="legal-back" href="./pay.html">Назад</a>
      <h2 class="pay-title">Банковская карта</h2>
      <p class="pay-note">Оплата картой откроется после договора с ЮKassa.</p>
      <div class="pay-stage">
      <section class="plan-card">
        <div class="tariffs">
          <span></span>
          <span class="tariff-name">Тариф Базовый</span>
          <span class="tariff-name">Тариф PRO</span>

          <span class="tariff-term">1 месяц</span>
          <button class="tariff-price" type="button">99 ₽</button>
          <button class="tariff-price" type="button">150 ₽</button>

          <span class="tariff-term">3 месяца<small>скидка</small></span>
          <button class="tariff-price" type="button">280 ₽</button>
          <button class="tariff-price" type="button">400 ₽</button>

          <span class="tariff-term">12 месяцев<small>скидка</small></span>
          <button class="tariff-price" type="button">1099 ₽</button>
          <button class="tariff-price" type="button">1600 ₽</button>
        </div>
      </section>
      </div>
    </main>
    <script src="./app.js?v=15"></script>
  </body>
</html>
