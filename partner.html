<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Партнёрка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app partner-page">
      <div class="partner-top">
        <a class="legal-back" href="./index.html">Назад</a>
        <span class="token-badge" id="token-badge"><svg class="pay-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17.6" r="12.6" fill="#C8880A"/><circle cx="16" cy="14.8" r="12.6" fill="#FFE14A"/><circle cx="16" cy="14.8" r="8.2" fill="none" stroke="#E8A317" stroke-width="1.8"/><path fill="#FFF6C2" d="M10 12.4a8.2 8.2 0 0 1 6.4-4.2 7 7 0 0 0-5.6 3.2 6 6 0 0 0-.8 1z"/></svg><span id="token-count">0</span></span>
      </div>
      <h2 class="pay-title">Партнёрка</h2>
      <section class="invite-card" aria-label="Пригласительная ссылка">
        <div class="invite-text">
          <p class="invite-label">Моя пригласительная ссылка на бот</p>
          <p class="invite-url" id="ref-link">Ссылка появится после входа через бота.</p>
        </div>
        <button class="invite-copy" type="button" id="ref-copy" aria-label="Скопировать ссылку">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="8" width="12" height="12" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6" />
            <rect x="4" y="4" width="12" height="12" rx="2.2" fill="#fff" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </button>
      </section>
      <section class="ref-box">
        <button class="ref-toggle" type="button" id="ref-toggle" aria-expanded="false">
          Мои рефералы
        </button>
        <div class="ref-list" id="ref-list" hidden></div>
      </section>
      <p class="partner-note">
        1 токен начисляется единожды, после того как ваш реферал оплатит подписку
      </p>
      <p class="toast" id="toast" hidden></p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
