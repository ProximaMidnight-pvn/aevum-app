<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Оплата</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=6" />
  </head>
  <body>
    <main class="app pay-page pay-flow" id="pay-method">
      <a class="legal-back" href="./pay.html">Назад</a>
      <h2 class="pay-title">Оплата</h2>
      <section class="pay-summary" aria-label="Выбранный срок">
        <p><span>Тариф</span><b id="sum-title">1 месяц</b></p>
        <p><span>Период</span><b id="sum-days">30 дней</b></p>
        <p class="sum-total"><span>Итого</span><b id="sum-rub">99 ₽</b></p>
      </section>
      <h3 class="method-heading">Способ оплаты</h3>
      <div class="method-list">
        <button class="method-btn" type="button" id="pay-sbp">
          <span class="pay-emoji" aria-hidden="true">🏦</span>
          <span class="method-copy">
            <b>СБП</b>
            <small id="sbp-price">99 ₽</small>
          </span>
        </button>
        <button class="method-btn" type="button" id="pay-stars">
          <span class="pay-emoji" aria-hidden="true">⭐</span>
          <span class="method-copy">
            <b>Telegram Stars</b>
            <small id="star-price">66 звёзд</small>
          </span>
        </button>
        <button class="method-btn" type="button" id="pay-crypto">
          <svg class="pay-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#FF5A00"/><circle cx="16" cy="16" r="11.5" fill="#FFB020"/><path fill="#fff" d="M16 8.4 21.2 16 16 23.6 10.8 16z"/></svg>
          <span class="method-copy">
            <b>Криптовалюта</b>
            <small>Выбрать криптовалюту</small>
          </span>
        </button>
        <button class="method-btn" type="button" id="pay-token">
          <svg class="pay-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17.6" r="12.6" fill="#C8880A"/><circle cx="16" cy="14.8" r="12.6" fill="#FFE14A"/><circle cx="16" cy="14.8" r="8.2" fill="none" stroke="#E8A317" stroke-width="1.8"/><path fill="#FFF6C2" d="M10 12.4a8.2 8.2 0 0 1 6.4-4.2 7 7 0 0 0-5.6 3.2 6 6 0 0 0-.8 1z"/></svg>
          <span class="method-copy">
            <b>Токены</b>
            <small id="token-price">2 токена</small>
          </span>
        </button>
      </div>
      <p class="pay-status" id="pay-status" hidden></p>
      <div class="crypto-modal" id="token-confirm" hidden>
        <button class="crypto-backdrop" type="button" id="token-confirm-close" aria-label="Закрыть"></button>
        <div class="crypto-card" role="dialog" aria-modal="true" aria-labelledby="token-confirm-title">
          <h3 id="token-confirm-title">Подтвердить оплату</h3>
          <p class="token-sum" id="token-sum">2 токена</p>
          <button class="pay-btn" type="button" id="token-confirm-yes">Подтвердить оплату</button>
        </div>
      </div>
      <p class="toast" id="toast" hidden></p>
    </main>
    <script src="./app.js?v=6"></script>
  </body>
</html>
